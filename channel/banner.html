<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    width: 2048px;
    height: 1152px;
    overflow: hidden;
    background: #061225;
  }
  .banner {
    position: relative;
    width: 2048px;
    height: 1152px;
    background: url("banner-raw.png") center center / cover no-repeat;
  }
  .banner::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      90deg,
      rgba(3, 10, 22, 0.95) 0%,
      rgba(3, 10, 22, 0.80) 34%,
      rgba(3, 10, 22, 0.28) 62%,
      rgba(3, 10, 22, 0) 100%
    );
  }
  .text {
    position: absolute;
    z-index: 2;
    left: 425px;
    top: 405px;
    width: 790px;
    color: #f7edd8;
    font-family: "Nirmala UI", "Segoe UI", sans-serif;
    text-shadow: 0 4px 26px rgba(0, 0, 0, 0.62);
  }
  .kicker {
    font-family: "Segoe UI", sans-serif;
    font-size: 18px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #e8b45b;
    font-weight: 600;
    margin-bottom: 12px;
  }
  h1 {
    margin: 0;
    font-size: 106px;
    line-height: 1.08;
    font-weight: 700;
    color: #fff6e5;
    letter-spacing: -0.01em;
  }
  .latin {
    font-family: "Segoe UI", sans-serif;
    font-size: 23px;
    letter-spacing: 0.42em;
    color: #d9a441;
    margin-top: 8px;
    font-weight: 600;
  }
  .rule {
    width: 110px;
    height: 4px;
    background: #d9a441;
    margin: 20px 0 17px;
    border-radius: 2px;
  }
  .tagline {
    font-size: 40px;
    line-height: 1.35;
    color: #f4e6c8;
    font-weight: 600;
  }
  .email {
    font-family: "Segoe UI", sans-serif;
    font-size: 19px;
    letter-spacing: 0.05em;
    color: #c5b491;
    margin-top: 22px;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="text">
      <div class="kicker">Hindi Story Channel</div>
      <h1>ओशो सीखे</h1>
      <div class="latin">OSHO SEEKHE</div>
      <div class="rule"></div>
      <div class="tagline">हर कहानी, एक सीख</div>
      <div class="email">oshosheekhe@gmail.com</div>
    </div>
  </div>
</body>
</html>
